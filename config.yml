socket_path: /tmp/xremap-nav.sock

signals:
  move.left:
    repeat: true
    interval_ms: 5
    actions:
      - socket_send: '{"action":"start","id":"move.left","command":["/nix/store/i2v76z76zfnd6ydcpp9c0371gkxy442i-hyprland-0.53.3/bin/hyprctl","dispatch","moveactive","-30","0"]}'
  move.right:
    repeat: true
    interval_ms: 5
    actions:
      - socket_send: '{"action":"start","id":"move.right","command":["/nix/store/i2v76z76zfnd6ydcpp9c0371gkxy442i-hyprland-0.53.3/bin/hyprctl","dispatch","moveactive","30","0"]}'
  move.up:
    repeat: true
    interval_ms: 5
    actions:
      - socket_send: '{"action":"start","id":"move.up","command":["/nix/store/i2v76z76zfnd6ydcpp9c0371gkxy442i-hyprland-0.53.3/bin/hyprctl","dispatch","moveactive","0","-30"]}'
  move.down:
    repeat: true
    interval_ms: 5
    actions:
      - socket_send: '{"action":"start","id":"move.down","command":["/nix/store/i2v76z76zfnd6ydcpp9c0371gkxy442i-hyprland-0.53.3/bin/hyprctl","dispatch","moveactive","0","30"]}'
  move.stop:
    actions:
      - socket_send: '{"action":"stop","id":"move.left"}'
      - socket_send: '{"action":"stop","id":"move.right"}'
      - socket_send: '{"action":"stop","id":"move.up"}'
      - socket_send: '{"action":"stop","id":"move.down"}'

  resize.left:
    repeat: true
    interval_ms: 5
    actions:
      - socket_send: '{"action":"start","id":"resize.left","command":["/nix/store/i2v76z76zfnd6ydcpp9c0371gkxy442i-hyprland-0.53.3/bin/hyprctl","dispatch","resizeactive","-20","0"]}'
  resize.right:
    repeat: true
    interval_ms: 5
    actions:
      - socket_send: '{"action":"start","id":"resize.right","command":["/nix/store/i2v76z76zfnd6ydcpp9c0371gkxy442i-hyprland-0.53.3/bin/hyprctl","dispatch","resizeactive","20","0"]}'
  resize.up:
    repeat: true
    interval_ms: 5
    actions:
      - socket_send: '{"action":"start","id":"resize.up","command":["/nix/store/i2v76z76zfnd6ydcpp9c0371gkxy442i-hyprland-0.53.3/bin/hyprctl","dispatch","resizeactive","0","-20"]}'
  resize.down:
    repeat: true
    interval_ms: 5
    actions:
      - socket_send: '{"action":"start","id":"resize.down","command":["/nix/store/i2v76z76zfnd6ydcpp9c0371gkxy442i-hyprland-0.53.3/bin/hyprctl","dispatch","resizeactive","0","20"]}'
  resize.stop:
    actions:
      - socket_send: '{"action":"stop","id":"resize.left"}'
      - socket_send: '{"action":"stop","id":"resize.right"}'
      - socket_send: '{"action":"stop","id":"resize.up"}'
      - socket_send: '{"action":"stop","id":"resize.down"}'
  nav.stop:
    actions:
      - socket_send: '{"action":"stop","id":"move.left"}'
      - socket_send: '{"action":"stop","id":"move.right"}'
      - socket_send: '{"action":"stop","id":"move.up"}'
      - socket_send: '{"action":"stop","id":"move.down"}'
      - socket_send: '{"action":"stop","id":"resize.left"}'
      - socket_send: '{"action":"stop","id":"resize.right"}'
      - socket_send: '{"action":"stop","id":"resize.up"}'
      - socket_send: '{"action":"stop","id":"resize.down"}'

# Hold Super, tap Space (space can be released), then:
#   H/J/K/L         → smooth window move   (release Super to stop)
#   Shift+H/J/K/L   → smooth window resize (release Super to stop)
# Float manually first with Super+D, Super+U if needed.
patterns:
  WindowNav: "Super_L space => noop ( space!|ε ) ( h => emit_start(move.left) | h! => emit_stop(move.left) ε => emit_stop(resize.left) ε => emit(nav.stop) | j => emit_start(move.down) | j! => emit_stop(move.down) ε => emit_stop(resize.down) ε => emit(nav.stop) | k => emit_start(move.up) | k! => emit_stop(move.up) ε => emit_stop(resize.up) ε => emit(nav.stop) | l => emit_start(move.right) | l! => emit_stop(move.right) ε => emit_stop(resize.right) ε => emit(nav.stop) | shift_l h => emit_start(resize.left) | shift_l j => emit_start(resize.down) | shift_l k => emit_start(resize.up) | shift_l l => emit_start(resize.right) | shift_l! => noop | space! => noop )* end_on(Super_L!) => emit(nav.stop)"
  # Hold Super+G, then hjkl to resize. Release G or Super to stop.
  Resize: "Super_L g => noop ( h => emit_start(resize.left) | h! => emit_stop(resize.left) ε => emit(resize.stop) | j => emit_start(resize.down) | j! => emit_stop(resize.down) ε => emit(resize.stop) | k => emit_start(resize.up) | k! => emit_stop(resize.up) ε => emit(resize.stop) | l => emit_start(resize.right) | l! => emit_stop(resize.right) ε => emit(resize.stop) | g! => emit_stop(resize.left) ε => emit_stop(resize.right) ε => emit_stop(resize.up) ε => emit_stop(resize.down) ε => emit(resize.stop) )* end_on(Super_L!) => emit(resize.stop)"

